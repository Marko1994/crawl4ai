version: '3.8'

# Shared configuration for all environments
x-base-config: &base-config
  # No host port publish: crawl4ai is reached over the kb-crawl network by
  # kb-worker (http://crawl4ai:11235), never from outside the host. Add back
  # `ports: ["127.0.0.1:11235:11235"]` here temporarily for local curl/debug.
  env_file:
    - .llm.env       # API keys (create from .llm.env.example)
  # Uncomment to set default environment variables (will overwrite .llm.env)
  # environment:
  #   - OPENAI_API_KEY=${OPENAI_API_KEY:-}
  #   - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
  #   - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
  #   - GROQ_API_KEY=${GROQ_API_KEY:-}
  #   - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
  #   - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
  #   - GEMINI_API_KEY=${GEMINI_API_KEY:-}
  #   - LLM_PROVIDER=${LLM_PROVIDER:-}  # Optional: Override default provider (e.g., "anthropic/claude-3-opus")
  # Chromium needs shared memory but the host /dev/shm bind was a shared,
  # writable mount; use a private sized tmpfs instead.
  shm_size: "1gb"
  # Least privilege: drop all capabilities, forbid privilege escalation, cap PIDs.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  # Read-only root filesystem; only these paths are writable (tmpfs).
  read_only: true
  tmpfs:
    - /tmp
    - /var/lib/redis:uid=999,gid=999,mode=0700
    - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
    - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
    # Keep the baked Playwright browser under ~/.cache/ms-playwright visible.
    - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
    - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
  deploy:
    resources:
      limits:
        memory: 4G
        # Must mirror pids_limit above - this compose CLI version (v2.29+)
        # rejects the config if the two disagree ("distinct values on
        # 'pids_limit' and 'deploy.resources.limits.pids'"). Pre-existing
        # upstream issue, reproduces on unmodified main; not caused by our
        # changes.
        pids: 512
      reservations:
        memory: 1G
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  user: "appuser"

services:
  crawl4ai:
    # 1. Default: pull our own prod image, built by
    #    .github/workflows/prod-image.yml from the prod-deploy branch and
    #    published to GHCR - `docker compose pull` is enough on prod, no
    #    local build required.
    # 2. Override with a different image/tag via: IMAGE=... TAG=... docker compose up
    image: ${IMAGE:-ghcr.io/marko1994/crawl4ai:${TAG:-latest}}

    # Local build config, used only when explicitly building
    # (`docker compose build` / `up --build`) - e.g. on a dev machine.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_TYPE: ${INSTALL_TYPE:-default}
        ENABLE_GPU: ${ENABLE_GPU:-false}
    
    # Inherit shared config
    <<: *base-config

    # Reachable from the kb project's containers as http://crawl4ai:11235.
    # `default` keeps this project's own compose network; `kb-crawl` is the
    # externally-created network shared with the kb-worker stack. The service
    # DNS alias only registers on networks declared here in compose - a
    # post-hoc `docker network connect` will NOT get the `crawl4ai` alias.
    networks: [default, kb-crawl]

networks:
  default: {}
  # PREREQUISITE: `external: true` means compose will NOT create this network.
  # If it does not already exist on the host, every `docker compose up` fails
  # immediately with:
  #
  #     network kb-crawl declared as external, but could not be found
  #
  # It is owned by the kb-worker stack, so on a host where that stack has never
  # run (a fresh VPS, a rebuilt box) you must create it before the first deploy:
  #
  #     docker network ls | grep kb-crawl        # check
  #     docker network create kb-crawl           # create if missing
  #
  # Do not "fix" this by dropping the network or switching it to non-external:
  # crawl4ai publishes no host port, so kb-crawl is the only path kb-worker has
  # to reach it. See deploy/docker/DEPLOY.md.
  kb-crawl:
    external: true